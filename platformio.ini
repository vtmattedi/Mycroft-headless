; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Everything shared by both boards. A child env that redefines build_flags must re-inherit these
; explicitly with ${env.build_flags} -- PlatformIO replaces the key rather than appending to it.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters =
	send_on_enter
	esp32_exception_decoder
; creds.h and Modules.config.h are this project's configuration, not the library's. They live in
; include/ so they survive a `pio pkg update`, which wipes and re-clones .pio/libdeps. Libraries
; are compiled with their own include path, so the project include dir has to be added explicitly
; here for NightMareNetwork's headers to find them.
build_flags =
	-I "${platformio.include_dir}"
board_build.partitions = min_spiffs.csv
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git
	bblanchon/ArduinoJson@^6.21.3
	; DallasTemperature pulls OneWire in on its own; it is pinned here because older OneWire
	; releases do not build for the C3's RISC-V core.
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
extra_scripts = pre:src/Version/script.py

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
; Talks through a USB-UART bridge; holding RTS/DTR low stops the adapter auto-resetting the board
; every time the monitor connects. The C3 does not need this -- it enumerates as USB directly.
monitor_rts = 0
monitor_dtr = 0
upload_protocol = espota
upload_port = 10.10.3.16

[env:esp32c3-supermini]
board = nologo_esp32c3_super_mini
; The board definition already supplies -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1, so the
; console comes out over native USB with no UART bridge involved.
; ESP32_C3 is NightMareNetwork's own switch, not an Arduino one: it makes the serial command
; resolver use HWCDC instead of HardwareSerial (see NightMareCommand.h). Without it the resolver
; would not compile against the C3's USB CDC console.
build_flags =
	${env.build_flags}
	-D ESP32_C3
upload_protocol = espota